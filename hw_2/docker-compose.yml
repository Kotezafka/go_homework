services:
  db:
    image: postgres:16-alpine
    container_name: cashapp-postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cashapp-network

  redis:
    image: redis:7-alpine
    container_name: cashapp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cashapp-network

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: cashapp-gateway
    environment:
      DATABASE_URL: "postgres://postgres_user:postgres_password@db:5432/cashapp?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cashapp-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cashapp-network:
    driver: bridge
